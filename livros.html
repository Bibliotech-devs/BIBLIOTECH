
<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Acervo | BiblioTech</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="site.css">

    <!-- CSS EXCLUSIVO DO ACERVO -->
    <link rel="stylesheet" href="livros.css">

    <!-- JAVASCRIPT -->
    <script src="app.js" defer></script>
</head>


<body>

    <!-- =====================================================
         CABEÇALHO
    ====================================================== -->

    <header class="site-header">

        <a class="brand" href="inicio.html">
            <img
                src="../site/img/logo_HD.png"
                alt="BiblioTech"
            >

            <span>BiblioTech</span>
        </a>


        <nav
            class="primary-nav"
            aria-label="Navegação principal"
        >

            <a href="inicio.html">
                Início
            </a>

            <a
                class="active"
                href="livros.html"
                aria-current="page"
            >
                Acervo
            </a>

            <a href="favoritos.html">
                Favoritos
            </a>

            <a href="perfil.html">
                Perfil
            </a>

            <a href="sobre.html">
                Sobre
            </a>

            <a href="suporte.html">
                Ajuda
            </a>

        </nav>


        <div class="header-actions">

            <a href="login.html">
                Entrar
            </a>

            <a
                class="button button-small"
                href="cadastro.html"
            >
                Criar conta
            </a>

        </div>

    </header>



    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <main class="page-shell page catalog-page">


        <!-- =================================================
             APRESENTAÇÃO DO ACERVO
        ================================================== -->

        <section
            class="page-intro"
            aria-labelledby="catalog-title"
        >

            <p class="eyebrow">
                Nosso acervo
            </p>

            <h1 id="catalog-title">
                Encontre sua próxima leitura
            </h1>

            <p>
                Explore títulos selecionados para aprender,
                imaginar e criar.
            </p>

        </section>



        <!-- =================================================
             BUSCA E FILTRO
        ================================================== -->

        <section
            class="catalog-controls"
            aria-label="Ferramentas de busca e filtro"
        >


            <!-- BUSCA -->

            <label class="search">

                <span aria-hidden="true">
                    ⌕
                </span>

                <input
                    id="book-search"
                    type="search"
                    placeholder="Buscar por título ou autor"
                    autocomplete="off"
                    aria-label="Buscar livro por título ou autor"
                >

            </label>



            <!-- FILTRO -->

            <label
                class="catalog-filter"
                aria-label="Categoria dos livros"
            >

                <span class="sr-only">
                    Filtrar por categoria
                </span>

                <select
                    id="genre-filter"
                    aria-label="Filtrar por categoria"
                >

                    <option value="">
                        Todas as categorias
                    </option>

                    <option value="Literatura">
                        Literatura
                    </option>

                    <option value="Ciência">
                        Ciência
                    </option>

                    <option value="Tecnologia">
                        Tecnologia
                    </option>

                    <option value="História">
                        História
                    </option>

                </select>

            </label>

        </section>



        <!-- =================================================
             ÁREA DOS LIVROS

             O app.js preenche este elemento
             automaticamente.
        ================================================== -->

        <section
            class="catalog-results"
            aria-labelledby="results-title"
        >

            <div class="catalog-results-header">

                <div>

                    <span class="section-label">
                        Biblioteca
                    </span>

                    <h2 id="results-title">
                        Livros disponíveis
                    </h2>

                </div>

            </div>


            <div
                id="book-grid"
                class="book-grid"
                aria-live="polite"
            >
                <!--
                    Os cards dos livros são inseridos
                    automaticamente pelo app.js.
                -->
            </div>

        </section>

    </main>



    <!-- =====================================================
         RODAPÉ
    ====================================================== -->

    <footer class="site-footer">

        <span>
            © 2026 BiblioTech
        </span>

        <span>
            Acervo digital para a escola.
        </span>

    </footer>


</body>

</html>
